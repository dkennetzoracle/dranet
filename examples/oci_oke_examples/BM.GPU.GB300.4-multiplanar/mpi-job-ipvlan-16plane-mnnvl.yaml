# all_reduce_perf over the NVLink fabric: the OCI multi-planar profile with
# NCCL_NVLS_ENABLE=1 and NCCL_MNNVL_ENABLE=1 as written, made possible by the
# ComputeDomain in compute-domain.yaml.
#
# Measured 839.19 GB/s busbw at 16 GiB, avg 809.14, correctness checking on.
# That is 87.8% of this GPU's 956.25 GB/s of NVLink (18 links x 53.125 GB/s),
# and 2.3x what the same job gets over the RoCE fabric.
#
# This measures NVLink, not the network. With MNNVL active NCCL collapses both
# physical nodes into one communicator -- `nNodes 1 localRanks 8 MNNVL 1` -- and
# stops using the NICs, so the rail claim below is carried but idle. Use
# mpi-job-ipvlan-16plane.yaml, which is identical bar NVLS/MNNVL being 0, to
# measure the fabric. The two answer different questions and both are in the
# README.
#
# Requires a ComputeDomain. Without one, both features abort with
# `Cuda failure 801 'operation not supported'`; see compute-domain.yaml.
#
# The four substitutions from the Slurm original (MP_HCAS, GID index 7 rather
# than 3, no NCCL_TOPO_FILE, no SPCX plugin) are documented in
# mpi-job-ipvlan-16plane.yaml and apply here unchanged.
apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: nccl-mp16-mnnvl
spec:
  slotsPerWorker: 4
  runPolicy:
    cleanPodPolicy: Running
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          nodeSelector:
            kubernetes.io/arch: arm64
          tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"
          containers:
          - name: nccl
            image: iad.ocir.io/idxzjcdglx2s/nccl-tests:cuda-13.1.1-ubuntu-24.04-nccl-2.29.3-020926.1
            command: ["/bin/bash", "-c"]
            args:
            - |
              NUM_HOSTS=$(sed -n '$=' /etc/mpi/hostfile)
              NP=$((NUM_HOSTS*4))
              while ! (for host in $(awk '{print $1}' /etc/mpi/hostfile); do
                ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no $host exit 2>/dev/null || exit 1
              done); do echo "Waiting for workers to be ready..."; sleep 5; done
              echo "All workers ready: $NUM_HOSTS nodes x 4 GPUs = $NP ranks"
              mpirun --bind-to numa \
                --allow-run-as-root \
                --mca coll ^hcoll \
                -x LD_LIBRARY_PATH \
                -x NCCL_DEBUG=INFO \
                -x UCX_NET_DEVICES=eth0 \
                -x RX_QUEUE_LEN=8192 \
                -x IB_RX_QUEUE_LEN=8192 \
                -x HCOLL_ENABLE_MCAST_ALL=0 \
                -x coll_hcoll_enable=0 \
                -x NCCL_SOCKET_IFNAME=eth0 \
                -x NCCL_IB_HCA="=rdma_rail0,mlx5_1,mlx5_0,mlx5_2,rdma_rail1,mlx5_4,mlx5_3,mlx5_5,rdma_rail2,mlx5_7,mlx5_6,mlx5_9,rdma_rail3,mlx5_10,mlx5_11,mlx5_12" \
                -x NCCL_ASYNC_ERROR_HANDLING=1 \
                -x NCCL_IB_TIMEOUT=16 \
                -x NCCL_IB_RETRY_CNT=7 \
                -x NCCL_IB_SL=0 \
                -x NCCL_IB_TC=96 \
                -x NCCL_IB_GID_INDEX=7 \
                -x NCCL_NVLS_ENABLE=1 \
                -x NCCL_MNNVL_ENABLE=1 \
                -x NCCL_WORK_FIFO_BYTES=0 \
                -x NCCL_NET_GDR_C2C=1 \
                -x NCCL_CUMEM_ENABLE=1 \
                -x NCCL_IGNORE_CPU_AFFINITY=1 \
                -x NCCL_NET_PLUGIN=none \
                -x NCCL_NET=IB \
                -x NCCL_IB_ADAPTIVE_ROUTING=1 \
                -x NCCL_IB_SPLIT_DATA_ON_QPS=0 \
                -x NCCL_IB_QPS_PER_CONNECTION=16 \
                --np $NP \
                /workspace/nccl-tests/build/all_reduce_perf -b 1G -e 16G -f 2 -g 1 -n 50
    Worker:
      replicas: 2
      template:
        spec:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    training.kubeflow.org/job-name: nccl-mp16-mnnvlb
                    training.kubeflow.org/job-role: worker
                topologyKey: kubernetes.io/hostname
          automountServiceAccountToken: false
          volumes:
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 64Gi
          resourceClaims:
          - name: rail-nics
            resourceClaimTemplateName: mp16-ipvlan
          - name: compute-domain-channel
            resourceClaimTemplateName: nccl-mp16-compute-domain-channel
          containers:
          - name: nccl
            image: iad.ocir.io/idxzjcdglx2s/nccl-tests:cuda-13.1.1-ubuntu-24.04-nccl-2.29.3-020926.1
            volumeMounts:
            - mountPath: /dev/shm
              name: shm
            resources:
              limits:
                nvidia.com/gpu: 4
              claims:
              - name: rail-nics
              - name: compute-domain-channel
            securityContext:
              privileged: true
          tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"
